name: Sentinel-Chain Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sentinel-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Sentinel-Chain Security Scan
        uses: ./
        with:
          fail-on-severity: 'critical'
          scan-path: 'backend/data/malicious-pkg'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
